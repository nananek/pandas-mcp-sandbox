[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pandas-table-sandbox"
version = "0.1.0"
description = "Isolated, declarative Pandas table operations for Open WebUI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/pandas_table_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
